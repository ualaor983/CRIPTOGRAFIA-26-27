[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoting"
version = "0.1.0"
description = "Sistema de voto electronico — practica de Criptografia 26/27"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0",
    "PyQt6>=6.7",
]

[project.scripts]
evoting = "evoting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
# S311: random no criptografico. Se deja activo a proposito: en este proyecto
# cualquier uso de `random` es un error, no una advertencia.

[tool.mypy]
python_version = "3.12"
packages = ["evoting"]
mypy_path = "src"
strict = true
